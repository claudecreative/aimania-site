<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TEST ROOM｜AI mania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ground:#F3EFE4;--ink:#1D1D1F;--yellow:#FFD21F;--red:#FF4B3A;--green:#19C25F;--phos:#7CFFB0;--phos-dim:#2F8F5B;--phos-glow:rgba(124,255,176,.55);--screen:#07140D;--screen2:#0d2a1a;--amber:#FFC24A}
/* 警報中は画面の色を赤に */
.alert{--phos:#FF7A6B;--phos-dim:#9A3A30;--phos-glow:rgba(255,90,70,.6);--screen:#160606;--screen2:#3a0c0c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px 32px;gap:18px}
a{color:inherit}
.back{position:fixed;top:14px;left:16px;font-size:13px;font-weight:700;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;background:#fff;box-shadow:3px 3px 0 var(--ink);z-index:5}
/* モニター本体 */
.monitor{width:min(760px,100%);background:#E9E3D2;border:3px solid var(--ink);border-radius:26px;padding:22px 22px 16px;box-shadow:8px 8px 0 var(--ink);position:relative}
.monitor:after{content:"";position:absolute;left:50%;bottom:-34px;width:34%;height:30px;transform:translateX(-50%);background:#DDD5BF;border:3px solid var(--ink);border-top:0;border-radius:0 0 14px 14px;z-index:-1}
.bezel{background:#2A2A2C;border-radius:18px;padding:16px;border:3px solid var(--ink)}
.screen{position:relative;overflow:hidden;background:radial-gradient(ellipse at center,var(--screen2) 0%,var(--screen) 70%);border-radius:14px/18px;padding:22px 18px 18px;color:var(--phos);font-family:'DotGothic16',monospace;text-shadow:0 0 6px var(--phos-glow);min-height:440px;transition:background .2s}
.screen:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);pointer-events:none;z-index:6}
.screen:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 60px rgba(0,0,0,.75);pointer-events:none;z-index:6;border-radius:inherit}
.flick{animation:flick 6s infinite}
@keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.86}}
/* 電源ON（ブラウン管がつく） */
.boot .screen>*{opacity:0}
.screen .pon{position:absolute;inset:0;z-index:7;pointer-events:none;background:#000;display:none}
.boot .screen>.pon{display:block;opacity:1;animation:pon .55s steps(6) forwards}
@keyframes pon{0%{clip-path:inset(49.5% 0 49.5% 0);background:#dfffee}40%{clip-path:inset(49.5% 0 49.5% 0);background:#dfffee}70%{clip-path:inset(20% 0 20% 0);background:#9fffcc;opacity:.6}100%{clip-path:inset(0 0 0 0);opacity:0}}
/* 上段 */
.hd{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--phos-dim);letter-spacing:.08em;gap:10px}
.rec{color:var(--red);text-shadow:0 0 6px rgba(255,75,58,.7);animation:blink 1s steps(1) infinite;margin-right:6px}
.time{color:var(--amber);text-shadow:0 0 6px rgba(255,194,74,.6);white-space:nowrap}
.time b{font-weight:400;display:inline-block;min-width:2ch;text-align:right}
.alert .time{color:var(--phos)}
/* ドットの導火線 */
.fuse{position:relative;height:10px;margin:10px 0 2px;background:repeating-linear-gradient(90deg,var(--phos-dim) 0 6px,transparent 6px 10px);opacity:.9}
.fuse .burnt{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--screen);transition:width 1s steps(4)}
.fuse .spark{position:absolute;top:-5px;left:0;width:20px;height:20px;transform:translateX(-10px);transition:left 1s steps(4)}
.fuse .spark i{position:absolute;width:4px;height:4px;background:var(--amber);box-shadow:0 0 6px var(--amber)}
.fuse .spark i:nth-child(1){left:8px;top:8px;background:#fff}
.fuse .spark i:nth-child(2){left:4px;top:4px;animation:sp .3s steps(1) infinite}
.fuse .spark i:nth-child(3){left:12px;top:2px;animation:sp .3s .1s steps(1) infinite}
.fuse .spark i:nth-child(4){left:14px;top:12px;animation:sp .3s .2s steps(1) infinite}
.fuse .spark i:nth-child(5){left:2px;top:13px;animation:sp .3s .15s steps(1) infinite}
@keyframes sp{50%{opacity:0}}
/* 赤いレーザー */
.laser{position:absolute;left:-10%;right:-10%;height:2px;top:30%;background:#ff3b3b;box-shadow:0 0 8px 2px rgba(255,60,60,.7);opacity:.5;z-index:5;pointer-events:none;animation:laser 7s steps(70) infinite;transform:rotate(-4deg)}
@keyframes laser{0%{top:12%}50%{top:88%}100%{top:12%}}
.title{margin:12px 0 2px;font-size:clamp(22px,4.6vw,32px);letter-spacing:.12em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-right:72px}
.title small{font-size:13px;letter-spacing:.14em;color:var(--phos-dim)}
.log{min-height:100px;margin:8px 0 12px;font-size:14px;line-height:1.75;color:#A8F5C8;padding-right:60px}
.alert .log{color:var(--phos)}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .say{white-space:normal;color:var(--phos)}
.log .ok{color:var(--phos)}
.log .wn{color:var(--amber);text-shadow:0 0 6px rgba(255,194,74,.6)}
.pw{display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap;border:2px solid var(--phos);border-radius:6px;padding:10px 14px;font-size:24px;letter-spacing:.2em;min-height:54px;background:rgba(124,255,176,.05)}
.pw .lab{font-size:13px;letter-spacing:.1em;color:var(--phos-dim);margin-right:6px}
.pw .cur{display:inline-block;width:12px;height:24px;background:var(--phos);animation:blink 1s steps(1) infinite;box-shadow:0 0 8px var(--phos)}
@keyframes blink{50%{opacity:0}}
.msg{height:22px;margin:10px 0 12px;font-size:15px}
.msg.ng{animation:blink .5s steps(1) 4}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
/* 画面の中のキーボード */
.kb{display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none}
.row{display:flex;gap:6px;justify-content:center}
.key{flex:1 1 0;min-width:0;max-width:52px;height:44px;border:2px solid var(--phos);border-radius:6px;background:transparent;color:var(--phos);font:inherit;font-size:17px;text-shadow:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .08s,color .08s,transform .08s;box-shadow:0 0 6px rgba(124,255,176,.25)}
.key:hover{background:rgba(124,255,176,.12)}
.key.on,.key:active{background:var(--phos);color:var(--screen);text-shadow:none;transform:translateY(2px)}
.key.wide{max-width:96px;flex:1.8 1 0;font-size:13px;letter-spacing:.06em}
.key.space{max-width:300px;flex:6 1 0}
.key.enter{border-color:var(--yellow);color:var(--yellow);text-shadow:0 0 6px rgba(255,210,31,.6)}
.key.enter.on,.key.enter:active{background:var(--yellow);color:var(--screen)}
/* ドットのスパイ（サングラスのモグボ） */
.agent{position:absolute;right:18px;top:62px;width:64px;height:64px;z-index:4;color:var(--phos);filter:drop-shadow(0 0 4px var(--phos-glow));animation:bob 2.4s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.agent .glint{animation:glint 3.2s steps(1) infinite}
@keyframes glint{0%,86%{opacity:0}88%,94%{opacity:1}96%,100%{opacity:0}}
/* 警報 */
.siren{position:absolute;left:0;right:0;top:40%;z-index:5;text-align:center;font-size:clamp(26px,6vw,44px);letter-spacing:.14em;display:none;pointer-events:none}
.siren span{display:inline-block;background:var(--screen);padding:4px 16px;border:2px solid var(--phos);animation:blink .3s steps(1) infinite}
.alert .siren{display:block}
/* 解錠 */
.win{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at center,var(--screen2) 0%,var(--screen) 70%);text-align:center;padding:20px}
.unlocked .win{display:flex}
.win .w1{font-size:16px;color:#A8F5C8}
.win .w2{font-size:clamp(34px,8vw,58px);letter-spacing:.1em;color:var(--yellow);text-shadow:0 0 10px rgba(255,210,31,.7),4px 4px 0 #5a4a00;animation:blink .4s steps(1) 3 .5s}
.win .w3{font-size:14px;color:var(--phos-dim);letter-spacing:.2em}
.win .bar{width:min(320px,70%);height:16px;border:2px solid var(--phos);padding:2px}
.win .bar i{display:block;height:100%;width:0;background:var(--phos);box-shadow:0 0 8px var(--phos);animation:load 1.3s steps(10) .3s forwards}
@keyframes load{to{width:100%}}
/* 退出のブロックワイプ */
.wipe{position:absolute;inset:0;z-index:8;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(4,1fr);pointer-events:none}
.wipe i{background:var(--phos);opacity:0}
.leaving .wipe i{animation:blk .05s steps(1) forwards}
@keyframes blk{to{opacity:1}}
/* ミスの残り（ハート） */
.lives{color:var(--red);text-shadow:0 0 6px rgba(255,75,58,.7);letter-spacing:.1em;margin-right:14px}
.lives .lost{color:var(--phos-dim);text-shadow:none;opacity:.5}
.warnbar{display:none;margin:8px 0 0;padding:6px 10px;border:2px dashed var(--amber);color:var(--amber);text-shadow:0 0 6px rgba(255,194,74,.6);font-size:14px;text-align:center;animation:warnb .6s steps(1) infinite}
@keyframes warnb{50%{opacity:.35}}
.warn1 .warnbar,.warn2 .warnbar{display:block}
.warn2 .warnbar{border-color:#ff5a4a;color:#ff7a6b;animation-duration:.3s}
/* 爆発 */
.boom{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;pointer-events:none;background:#000}
.exploding .boom{display:flex}
.boom .flash{position:absolute;inset:0;background:#fff;animation:flash .6s steps(3) forwards}
@keyframes flash{0%{opacity:1}33%{opacity:.2;background:#ffd21f}66%{opacity:.8;background:#ff5a2a}100%{opacity:0}}
.boom .px{position:absolute;left:50%;top:46%;width:8px;height:8px;background:#ffd21f;box-shadow:0 0 8px #ff8a00;opacity:0}
.exploding .boom .px{animation:px 1s steps(8) forwards}
@keyframes px{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
.boom .bt{position:relative;font-size:clamp(46px,12vw,92px);letter-spacing:.08em;color:#ffd21f;text-shadow:0 0 14px #ff8a00,6px 6px 0 #a3290f;transform:scale(0);animation:bt .5s .35s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes bt{to{transform:scale(1)}}
.boom .bs{position:relative;font-size:16px;color:#ff9b8f;letter-spacing:.14em;opacity:0;animation:fadein .2s 1.1s forwards}
.boom .bc{position:relative;font-size:14px;color:var(--phos-dim);letter-spacing:.2em;opacity:0;animation:fadein .2s 1.8s forwards,blink .8s 2s steps(1) infinite}
@keyframes fadein{to{opacity:1}}
.exploding .monitor,.exploding.monitor{animation:quake .5s steps(10) 2}
@keyframes quake{10%{transform:translate(-10px,6px) rotate(-1deg)}30%{transform:translate(9px,-7px) rotate(1deg)}50%{transform:translate(-7px,-4px)}70%{transform:translate(6px,7px) rotate(-.6deg)}90%{transform:translate(-3px,2px)}}
.knobs{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:0 6px}
.brand{font-weight:700;font-size:12px;letter-spacing:.2em}
.led{width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
.alert-led .led{animation:blink .25s steps(1) infinite}
.unlocked .led{background:var(--green);box-shadow:0 0 8px var(--green);animation:none}
.note{font-size:12px;color:#77746d;text-align:center;max-width:560px;line-height:1.7;margin-top:22px}
@media (max-width:560px){body{padding-top:66px;justify-content:flex-start}.monitor{padding:14px 12px 12px;border-radius:20px}.bezel{padding:10px}.screen{padding:16px 10px 14px;min-height:0}.key{height:40px;font-size:15px;border-radius:5px}.row{gap:4px}.kb{gap:4px}.pw{font-size:20px}.key.wide{font-size:11px;letter-spacing:0;flex:1.5 1 0}.agent{width:44px;height:44px;top:52px;right:10px}.title{padding-right:50px}.log{font-size:12.5px;min-height:92px;padding-right:0}.title small{display:none}}
@media (prefers-reduced-motion:reduce){.flick,.pw .cur,.laser,.agent,.agent .glint,.fuse .spark i{animation:none}.boot .screen>.pon{display:none}.boot .screen>*{opacity:1}}
</style>

  if(reduce){d.innerHTML=isSay?t:t+'<span class="'+l[2]+'">'+l[1]+'</span>';next();return}
  (function tc(){d.textContent=t.slice(0,++n);if(n<t.length){setTimeout(tc,isSay?45:14)}else{if(!isSay)d.innerHTML=t+'<span class="'+l[2]+'">'+l[1]+'</span>';setTimeout(next,200)}})();
 })();
}

/* 制限時間と導火線（ゲームの残りタイム風。0になったら指令を出し直す） */
var left=LIMIT,timer;
function drawFuse(){var p=(LIMIT-left)/LIMIT*100;document.getElementById('burnt').style.width=p+'%';document.getElementById('spark').style.left=p+'%';document.getElementById('time').textContent=left}
function startTimer(){clearInterval(timer);left=LIMIT;drawFuse();timer=setInterval(function(){
 if(done){clearInterval(timer);return}
 left--;drawFuse();
 if(left===10)addLine('> <span class="wn">HURRY UP!</span>');
 if(left<=0){clearInterval(timer);addLine('> TIME OVER … <span class="wn">CONTINUE?</span>');buf='';render();
  setTimeout(function(){if(!done){addLine('▶ しれいしょを もういちど おくった。','say');startTimer()}},1400)}
},1000)}

/* 判定 */
function hex(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function check(){
 if(busy||done)return;
 if(!buf.length){msg.className='msg';msg.textContent='▶ あんごうを いれてください';return}
 busy=true;msg.className='msg';msg.textContent='DECODING …';
 var p=(window.crypto&&crypto.subtle)?crypto.subtle.digest('SHA-256',new TextEncoder().encode(buf)).then(hex):Promise.resolve(buf==='test'?HASH:'');
 p.then(function(h){setTimeout(function(){busy=false;
  if(h===HASH){store(false,'1');success()}else if(h===WANO){wano()}else if(h===TANTEI){tantei()}else if(h===GRANI){grani()}else if(h===NURSE){nurse()}else if(h===CARE){care()}else if(h===WHITE){white()}else if(h===CHIKAI){chikai()}else if(h===TRANS){trans()}else if(h===LINAE){f_linae()}else if(h===SHIRAE){f_shirae()}else if(h===HODOKE){f_hodoke()}else{fail()}
 },reduce?100:420)});
}
var miss=0,LIVES=3;
function drawLives(){var h='';for(var i=0;i<LIVES;i++)h+=i<LIVES-miss?'♥':'<span class="lost">♥</span>';var el=document.getElementById('lives');el.innerHTML=h;el.setAttribute('aria-label','のこり'+(LIVES-miss)+'回')}
function fail(){
 miss++;drawLives();buf='';render();

 var wb=document.getElementById('warnbar');
 body.classList.remove('warn1','warn2');body.classList.add(miss===1?'warn1':'warn2');
 wb.textContent=miss===1?'⚠ WARNING：あと2回 まちがえると ばくはつします':'⚠ DANGER：つぎ まちがえたら ばくはつ！！';
 body.classList.add('alert','alert-led');mon.classList.remove('shake');void mon.offsetWidth;mon.classList.add('shake');

}
function explode(){
 busy=true;clearInterval(timer);msg.textContent='';
 var boom=document.getElementById('boom');
 [].slice.call(boom.querySelectorAll('.px')).forEach(function(n){n.remove()});
 for(var i=0;i<26;i++){var q=document.createElement('i');q.className='px';var a=Math.random()*Math.PI*2,r=120+Math.random()*260;q.style.setProperty('--x',Math.cos(a)*r+'px');q.style.setProperty('--y',Math.sin(a)*r+'px');q.style.animationDelay=(Math.random()*.15)+'s';if(i%3===0)q.style.background='#ff5a2a';boom.appendChild(q)}
 body.classList.remove('alert','alert-led','warn1','warn2');
 body.classList.remove('exploding');void body.offsetWidth;body.classList.add('exploding','alert-led');
 if(navigator.vibrate)try{navigator.vibrate([300,80,300])}catch(e){}
 setTimeout(function(){
  body.classList.remove('exploding','alert-led');busy=false;miss=0;drawLives();
  log.innerHTML='';typeLines([['> REBOOT ……………………… ','OK','ok'],['say','▶ ターミナルを たてなおした。 こんどは しんちょうに。'],['say','※ 3かい まちがえると ばくはつする。']]);
  startTimer();
 },3600);
}

function press(v){
 if(done)return;flash(v);
 if(v==='Enter'){check();return}
 if(v==='Backspace'){buf=buf.slice(0,-1)}else if(v==='Clear'){buf=''}else if(buf.length<MAX){buf+=v}

}
document.addEventListener('keydown',function(e){
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='Enter'||e.key==='Backspace'){e.preventDefault();press(e.key);return}
 if(e.key==='Escape'){press('Clear');return}
 if(e.key.length===1){e.preventDefault();press(e.key.toLowerCase())}
});
