<style>

.qq{font-size:14px;font-weight:700;margin-top:9px;line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}

.card{margin-top:12px;background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(31,60,58,.07);padding:10px 12px;display:flex;gap:10px;align-items:center}

.next{position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--tl);text-align:center;overflow:hidden;border-radius:24px 24px 0 0}
.next h2{font-size:22px;font-weight:900;margin-top:12px}
</style></head><body>

</div><script>
(function(){var Q=[['作業するなら、どれがいちばん楽しそう？',['見た目を整える','映像をつなぐ','数字で改善する']],

N=['デザイン','動画編集','Webマーケ'],sc=[0,0,0],k=0,body=document.getElementById('qbody');
