<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>スキルえらびナビ｜無料オンラインセミナー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--base:#F7F6F2;--teal:#1F6F6B;--orange:#F28C38;--ink:#2B2B2B;--sub:#6B6B6B;--tl:#DDEDEA}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9e8e3;font-family:'Noto Sans JP','Noto Sans CJK JP',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.fv{width:390px;height:844px;margin:0 auto;background:var(--base);position:relative;overflow:hidden}
a{text-decoration:none}
.hd{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(31,111,107,.08)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:.02em;color:var(--ink)}
.logo i{width:26px;height:26px;border-radius:50%;background:var(--teal);display:grid;place-items:center}
.logo i svg{width:15px;height:15px}
.logo b{color:var(--teal)}
.hbtn{background:var(--orange);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:8px 12px;letter-spacing:.02em}
.in{padding:16px 20px 0}
.pill{display:inline-block;background:var(--tl);color:var(--teal);font-size:12px;font-weight:700;border-radius:999px;padding:5px 12px;letter-spacing:.02em}
h1{font-size:28px;line-height:1.44;font-weight:900;letter-spacing:.01em;margin-top:12px;font-feature-settings:"palt"}
h1 em{font-style:normal;color:var(--teal);background:linear-gradient(transparent 70%,var(--tl) 70%,var(--tl) 94%,transparent 94%)}
.sub{font-size:14px;line-height:1.75;letter-spacing:-.01em;color:var(--sub);margin-top:10px;letter-spacing:.01em}
.sub b{color:var(--ink);font-weight:700}
.vis{position:relative;height:256px;margin-top:16px}
.vis .ph{position:absolute;inset:0;border-radius:24px;overflow:hidden}
.vis .ph img{width:100%;height:100%;object-fit:cover;object-position:30% 40%;filter:brightness(1.03)}
.bub{position:absolute;right:10px;top:12px;width:176px;background:#fff;border-radius:14px;padding:10px 12px 9px;box-shadow:0 6px 18px rgba(31,60,58,.12);font-size:12px;line-height:1.55}
.bub:after{content:'';position:absolute;left:22px;bottom:-7px;width:14px;height:14px;background:#fff;transform:rotate(45deg);border-radius:2px}
.bub .q{color:var(--sub);font-weight:500}
.bub .a{display:flex;align-items:center;gap:4px;margin-top:3px;font-weight:700;color:var(--teal);font-size:12.5px;white-space:nowrap}
.bub .a svg{width:13px;height:13px}
.skills{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;background:#fff;border-radius:12px;padding:7px 8px;box-shadow:0 6px 18px rgba(31,60,58,.12)}
.skills span{display:grid;justify-items:center;gap:2px;width:52px;font-size:9.5px;white-space:nowrap;letter-spacing:-.02em;color:var(--sub);font-weight:500}
.skills i{width:30px;height:30px;border-radius:50%;background:var(--tl);display:grid;place-items:center}
.skills svg{width:16px;height:16px}
.card{margin-top:16px;background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(31,60,58,.08);padding:12px 14px;display:flex;gap:12px;align-items:center}
.card .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--tl);display:grid;place-items:center}
.card .ic svg{width:24px;height:24px}
.card b{display:block;color:var(--teal);font-size:14.5px;font-weight:700;line-height:1.4}
.card small{display:block;font-size:11.5px;color:var(--ink);line-height:1.6}
.card small.g{color:var(--sub)}
.card small em{font-style:normal;font-weight:700;color:var(--teal)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;height:60px;border-radius:30px;background:var(--orange);color:#fff;font-size:18px;font-weight:700;letter-spacing:.03em;box-shadow:0 6px 16px rgba(242,140,56,.32)}
.cta span{font-size:22px;line-height:1;margin-top:-2px}
.note{text-align:center;font-size:12px;color:var(--sub);margin-top:8px}
.next{position:absolute;left:0;right:0;bottom:0;height:52px;border-radius:24px 24px 0 0;background:var(--tl);text-align:center;overflow:hidden}
.next p{font-size:11px;color:var(--teal);font-weight:700;letter-spacing:.16em;margin-top:10px}
.next h2{font-size:22px;font-weight:900;margin-top:0;color:var(--ink)}
</style></head><body>
<div class="fv">
<header class="hd"><div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z" fill="#fff"/></svg></i><span>スキル<b>えらび</b>ナビ</span></div><a class="hbtn" href="#">無料セミナー</a></header>
<div class="in">
<span class="pill">副業・フリーランスを考えはじめた方へ</span>
<h1>スクールを選ぶ前に、<br><em>“自分に合うスキル”</em>を<br>選んでいますか？</h1>
<p class="sub">なんとなくで選ぶと、遠回りになりがち。<br><b>60分で、あなたに合うスキルの選び方</b>がわかります。</p>
<div class="vis"><div class="ph"><img src="photo.jpg" alt="自宅でノートPCを見ながら、ほっとした表情の女性"></div>
<div class="bub"><div class="q">デザイン？ 動画編集？<br>Webマーケ？</div><div class="a"><svg viewBox="0 0 24 24" fill="none" stroke="#1F6F6B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>向いているのはどれ？</div></div>
<div class="skills">
<span><i><svg viewBox="0 0 24 24" fill="none" stroke="#1F6F6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5L9 20H4v-5z"/><path d="M12.5 6.5l5 5"/></svg></i>デザイン</span>
<span><i><svg viewBox="0 0 24 24" fill="none" stroke="#1F6F6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg></i>動画編集</span>
<span><i><svg viewBox="0 0 24 24" fill="none" stroke="#1F6F6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 15l4-4 3 3 5-6"/><path d="M15 8h3v3"/></svg></i>Webマーケ</span>
</div></div>
<div class="card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1F6F6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 14.5 2 2 4-4"/></svg></div>
<div><b>無料オンラインセミナー</b><small>毎週開催｜60分｜顔出し・発言なしでOK</small><small class="g">参加特典：<em>自分に合うスキルがわかる診断シート</em></small></div></div>
<a class="cta" href="#">無料セミナーの日程を見る<span>›</span></a>
<p class="note">スクールの勧誘はありません／申込は1分で完了</p>
</div>
<div class="next"><p>CHECK</p><h2>こんなお悩みありませんか？</h2></div>
</div></body></html>
