<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/test/guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>おやすみ中｜AI mania TEST ROOM</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--sky:#BFE3F2;--sky2:#E8F6FB;--grass:#7CC66A;--grass2:#5BAE4C;--ink:#1D1D1F;--yellow:#FFD21F;--red:#FF4B3A}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(var(--sky2),var(--sky));font-family:'DotGothic16',monospace;color:var(--ink);overflow:hidden;display:flex;flex-direction:column}
.msg{position:relative;z-index:3;margin:clamp(28px,8vh,72px) auto 0;text-align:center;padding:0 16px}
.win{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);padding:14px 22px;font-size:clamp(15px,2.4vw,20px);line-height:1.7}
.win small{display:block;font-size:13px;color:#555}
.back{display:inline-block;margin-top:14px;font-size:13px;color:var(--ink)}
.scene{position:relative;flex:1;min-height:320px}
/* 雲 */
.cloud{position:absolute;width:120px;height:36px;background:#fff;border-radius:20px;opacity:.95;box-shadow:30px -14px 0 4px #fff,62px 0 0 -2px #fff}
.c1{top:6%;left:-160px;animation:drift 38s linear infinite}
.c2{top:18%;left:-160px;transform:scale(.7);animation:drift 52s linear -20s infinite}
.c3{top:2%;left:-160px;transform:scale(.5);animation:drift 64s linear -40s infinite}
@keyframes drift{to{left:110%}}
/* 地面 */
.ground{position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,var(--grass) 0 24px,var(--grass2) 24px 48px);border-top:4px solid var(--ink)}
.flower{position:absolute;bottom:calc(34% - 4px);width:8px;height:16px;background:#3E8E32}
.flower:before{content:"";position:absolute;left:-4px;top:-10px;width:16px;height:12px;background:var(--red);border:2px solid var(--ink)}
.f1{left:12%}.f2{left:78%}.f3{left:58%;transform:scale(.8)}
.f2:before{background:var(--yellow)}
/* モグボ */
.chr{--c:var(--yellow);--a:var(--red);--top:linear-gradient(var(--a) 0 0) 5em 0/2em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 5em 1em/2em 1em no-repeat;--body:linear-gradient(var(--c) 0 0) 3em 3em/6em 1em no-repeat,linear-gradient(var(--c) 0 0) 2em 4em/8em 5em no-repeat;display:block;width:12em;height:12em;background:
linear-gradient(#1D1D1F 0 0) 4em 5em/1em 2em no-repeat,linear-gradient(#1D1D1F 0 0) 7em 5em/1em 2em no-repeat,
linear-gradient(#1D1D1F 0 0) 5em 7em/2em 1em no-repeat,var(--top),var(--body),
linear-gradient(#1D1D1F 0 0) 3em 2em/6em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 2em 3em/1em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 9em 3em/1em 1em no-repeat,
linear-gradient(#1D1D1F 0 0) 1em 4em/1em 5em no-repeat,linear-gradient(#1D1D1F 0 0) 10em 4em/1em 5em no-repeat,linear-gradient(#1D1D1F 0 0) 2em 9em/8em 1em no-repeat,
linear-gradient(#1D1D1F 0 0) 3em 10em/2em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 7em 10em/2em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 2em 11em/3em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 7em 11em/3em 1em no-repeat}
/* うれしい顔（目を細める）を時々 */
.happy .chr{background:
linear-gradient(#1D1D1F 0 0) 4em 6em/1em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 7em 6em/1em 1em no-repeat,
linear-gradient(#1D1D1F 0 0) 5em 7em/2em 1em no-repeat,var(--top),var(--body),
linear-gradient(#1D1D1F 0 0) 3em 2em/6em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 2em 3em/1em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 9em 3em/1em 1em no-repeat,
linear-gradient(#1D1D1F 0 0) 1em 4em/1em 5em no-repeat,linear-gradient(#1D1D1F 0 0) 10em 4em/1em 5em no-repeat,linear-gradient(#1D1D1F 0 0) 2em 9em/8em 1em no-repeat,
linear-gradient(#1D1D1F 0 0) 3em 10em/2em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 7em 10em/2em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 2em 11em/3em 1em no-repeat,linear-gradient(#1D1D1F 0 0) 7em 11em/3em 1em no-repeat}
.player{position:absolute;bottom:calc(34% - 2px);left:20%;font-size:7px;animation:walk 12s ease-in-out infinite}
.player .body{animation:hop .5s steps(2) infinite}
.player.happy .body{animation:jump .7s ease-out}
@keyframes hop{50%{transform:translateY(-4px)}}
@keyframes jump{40%{transform:translateY(-46px) rotate(-8deg)}100%{transform:none}}
@keyframes walk{0%,100%{left:12%}50%{left:calc(88% - 84px)}}
.player .turn{animation:turn 12s steps(1) infinite}
@keyframes turn{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
/* ボール（ドリブル） */
.ball{position:absolute;left:92px;bottom:0;width:26px;height:26px;border:3px solid var(--ink);border-radius:50%;background:
radial-gradient(circle at 50% 50%,var(--red) 0 30%,transparent 31%),conic-gradient(#fff 0 25%,#ffe9e6 0 50%,#fff 0 75%,#ffe9e6 0);animation:dribble .5s cubic-bezier(.5,0,.5,1) infinite alternate}
@keyframes dribble{from{transform:translateY(-56px)}to{transform:translateY(0) scale(1.1,.85)}}
.shadow{position:absolute;left:94px;bottom:-6px;width:24px;height:6px;border-radius:50%;background:rgba(0,0,0,.18);animation:sh .5s cubic-bezier(.5,0,.5,1) infinite alternate}
@keyframes sh{from{transform:scale(.5);opacity:.4}to{transform:scale(1);opacity:1}}
/* 吹き出し */
.say{position:absolute;bottom:104px;left:-10px;white-space:nowrap;background:#fff;border:3px solid var(--ink);border-radius:8px;padding:4px 10px;font-size:14px;opacity:0;transition:opacity .3s}
.say.on{opacity:1}
.turn .say{transform:scaleX(1)}
.player .flip-text{display:inline-block}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="msg">
<div class="win">▶ このページは ただいま おやすみちゅう<small>モグボが あそんで まっています</small></div><br>
<a class="back" href="/test/">← テストルームの いちらんへ</a>
</div>
<div class="scene" aria-hidden="true">
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
<div class="flower f1"></div><div class="flower f2"></div><div class="flower f3"></div>
<div class="ground"></div>
<div class="player" id="pl"><div class="turn"><div class="body"><span class="chr"></span></div><div class="ball"></div><div class="shadow"></div><div class="say" id="say"></div></div></div>
</div>
<script>
(function(){var pl=document.getElementById('pl'),say=document.getElementById('say');
var lines=['ドリブル ちゅう！','まだかな〜','みててね！','たのしい！'];var i=0;
function joy(){pl.classList.add('happy');say.textContent=lines[i++%lines.length];say.classList.add('on');setTimeout(function(){pl.classList.remove('happy')},700);setTimeout(function(){say.classList.remove('on')},1800)}
setTimeout(joy,1200);setInterval(joy,4200);
// 向きが反転しても文字は読めるように
setInterval(function(){var t=getComputedStyle(pl.querySelector('.turn')).transform;say.style.transform=(t&&t.indexOf('-1')>-1)?'scaleX(-1)':'none'},200);
pl.addEventListener('click',joy);})();
</script>
</body>
</html>
