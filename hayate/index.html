<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>疾風忍伝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one 4:3 pixel screen centered on a night field; touch pads flank it (landscape) or sit under it (portrait) */
:root{
  --night:#05071a;
  --ink:#0b0d24;
  --paper:#e9e4d4;
  --moon:#f4e4a0;
  --vermilion:#d8282a;
  --indigo:#2b3fd1;
  --dim:#8a8fb8;
  --dot:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--dot);margin:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;padding-inline:16px;padding-block:10px;display:grid;gap:12px;place-content:center;justify-items:center;grid-template-areas:"stage"}
/* Touch: landscape only. The screen fills the phone and the pads float over it */
html.touch,html.touch body{touch-action:none;overscroll-behavior:none;position:fixed;inset:0;width:100%;height:100%}
#app.touch{padding:0;display:block;position:fixed;inset:0}
#app.touch #stage{position:absolute;inset:0;justify-content:center}
#app.touch #screen{box-shadow:none}
#app.touch #stage{overflow:hidden}
#app.touch #legend{display:none}
.pad{display:none;position:absolute;z-index:2}
#app.touch.land .pad{display:block}
.pad button,#dpad{font-family:var(--dot);color:rgba(255,255,255,.9);background:rgba(8,10,36,.2);border:2px solid rgba(255,255,255,.35);touch-action:none;padding:0;cursor:pointer;text-shadow:0 1px 2px #000}
.pad button{position:absolute;border-radius:50%;width:var(--bs);height:var(--bs);font-size:calc(var(--bs)*.3)}
.pad button.on{background:rgba(244,228,160,.38);border-color:var(--moon)}
#padL{left:0;bottom:0;width:44%;height:78%;touch-action:none}
#dpad{position:absolute;left:calc(env(safe-area-inset-left) + 22px);bottom:18px;width:136px;height:136px;border-radius:50%;pointer-events:none;background:rgba(10,12,30,.38);border:3px solid rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#dpad .ar{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;color:rgba(255,255,255,.7)}
#dpad .ar.l{left:9px}#dpad .ar.r{right:9px}
#dpad .ar.on{color:#fff}
#knob{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:#f1ebe2;border:3px solid #1a1a22;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 3px 6px rgba(0,0,0,.45);pointer-events:none}
#padR{right:calc(env(safe-area-inset-right) + 14px);bottom:12px;width:236px;height:196px}
#padR button{position:absolute;border-radius:50%;color:#fff;font-weight:400;font-family:var(--dot);border:3px solid #14141c;background:radial-gradient(circle at 50% 30%,var(--c1) 0 55%,var(--c2) 75%);box-shadow:inset 0 -7px 0 var(--c3),0 4px 0 #14141c,0 6px 10px rgba(0,0,0,.45);text-shadow:-2px 0 #14141c,2px 0 #14141c,0 -2px #14141c,0 2px #14141c,2px 2px #14141c;-webkit-text-stroke:0}
#padR button.on{transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--c3),0 1px 0 #14141c}
#padR [data-k=slash]{right:0;bottom:16px;width:96px;height:96px;font-size:34px;--c1:#ec3b2e;--c2:#c8241d;--c3:#8c140f;border-color:#14141c;outline:4px solid #f4c430;outline-offset:-1px}
#padR [data-k=jump]{right:108px;bottom:2px;width:78px;height:78px;font-size:26px;--c1:#3f6ff0;--c2:#2a50d0;--c3:#18308a}
#padR [data-k=shoot]{right:120px;bottom:92px;width:64px;height:64px;font-size:15px;--c1:#2eae8a;--c2:#1f8a6a;--c3:#11573f}
#padR [data-k=bomb]{right:24px;bottom:124px;width:58px;height:58px;font-size:20px;--c1:#9a5ae0;--c2:#7a3ec0;--c3:#4a2080}
#padS{top:calc(13.4vh + 6px);right:calc(env(safe-area-inset-right) + 10px);display:none;gap:8px}
#app.touch.land #padS{display:flex}
#padS button{position:static;width:40px;height:32px;border-radius:8px;font-size:13px;background:rgba(8,10,36,.45)}
#padS #fullBtn{width:58px}
#rotate{display:none;position:fixed;inset:0;z-index:5;background:var(--night);color:var(--paper);place-content:center;justify-items:center;gap:14px;text-align:center;font-size:18px;line-height:1.6;padding:16px}
#rotate i{font-style:normal;font-size:56px;display:block;animation:rot 2s ease-in-out infinite}
#app.touch:not(.land) #rotate{display:grid}
@keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (max-height:340px){#padL{--bs:56px}#dpad{width:118px;height:118px}#padR{transform:scale(.85);transform-origin:right bottom}}
@media (prefers-reduced-motion: reduce){#rotate i{animation:none}}
</style>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="960" height="720" tabindex="0" aria-label="疾風忍伝 ゲーム画面"></canvas>
    <div id="legend"><b>← →</b>移動　<b>Z</b>ジャンプ　<b>X</b>手裏剣　<b>C</b>刀　<b>V</b>焙烙玉　<b>Enter</b>スタート/ポーズ　<b>M</b>音 オン/オフ</div>
  </div>
  <div class="pad" id="padL"><div id="dpad" aria-label="左右に移動"><span class="ar l">◀</span><span class="ar r">▶</span><b id="knob"></b></div></div>
  <div class="pad" id="padR">
    <button data-k="slash">刀</button>
    <button data-k="bomb">爆</button>
    <button data-k="shoot">手裏剣</button>
    <button data-k="jump">跳</button>
  </div>
  <div class="pad" id="padS">
    <button data-k="full" id="fullBtn" aria-label="全画面">全画面</button>
    <button data-k="mute" aria-label="音 オン/オフ">音</button>
    <button data-k="start" aria-label="ポーズ">II</button>
  </div>
  <div id="rotate"><i>📱</i>スマホを 横向きに してね<br><small style="color:var(--dim);font-size:13px">疾風忍伝は 横画面で 遊ぶゲームです</small></div>
</div>

const isTouch=(window.matchMedia&&matchMedia('(pointer: coarse)').matches)||(navigator.maxTouchPoints>0&&'ontouchstart' in window);
// Touch devices play in landscape: widen the logical screen to the phone's aspect (height stays 240)
// Touch devices play in landscape: the logical width follows the viewport's shape (height stays 240)
function pickW(){if(!isTouch)return 320;const de=document.documentElement;let w=Math.min(innerWidth,de.clientWidth||9999),h=Math.min(innerHeight,de.clientHeight||9999);if(w<h){w=Math.max(screen.width,screen.height);h=Math.min(screen.width,screen.height);}const a=w/Math.max(1,h);return Math.max(320,Math.min(624,Math.round(240*a/16)*16));}
let W=pickW();
const H=240,HUD=32,TS=16,ROWS=13,PH=ROWS*TS;let OX=(W-320)/2,CX=W/2;
const FONT='"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace';
const cv=document.getElementById('screen'), ctx=cv.getContext('2d');
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return [c,g];}
const [buf,b]=mk(W*2,H*2);
function rng(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function hash(x,y){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
function rect(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function disc(g,cx,cy,r,c){g.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1);}}
function ring(g,cx,cy,r,c){g.fillStyle=c;for(let a=0;a<64;a++){const t=a/64*Math.PI*2;g.fillRect(Math.round(cx+Math.cos(t)*r),Math.round(cy+Math.sin(t)*r),1,1);}}
function line(g,x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);g.fillStyle=c;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let i=0;i<200;i++){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function epx(c){const w=c.width,h=c.height;const s=new Uint32Array(c.getContext('2d').getImageData(0,0,w,h).data.buffer);const [o,og]=mk(w*2,h*2);const out=og.createImageData(w*2,h*2);const d=new Uint32Array(out.data.buffer);const W2=w*2;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const P=s[y*w+x];const A=y>0?s[(y-1)*w+x]:P,F=x<w-1?s[y*w+x+1]:P,C=x>0?s[y*w+x-1]:P,D=y<h-1?s[(y+1)*w+x]:P;
    let e0=P,e1=P,e2=P,e3=P;if(A!==D&&C!==F){if(C===A)e0=A;if(A===F)e1=F;if(D===C)e2=C;if(F===D)e3=D;}
    const i=y*2*W2+x*2;d[i]=e0;d[i+1]=e1;d[i+W2]=e2;d[i+W2+1]=e3;}
  og.putImageData(out,0,0);return o;}
function shadeC(c,amt){amt=amt||0.16;const w=c.width,h=c.height,g=c.getContext('2d');const im=g.getImageData(0,0,w,h),d=im.data;const s=new Uint8ClampedArray(d);
  const lum=i=>s[i]*0.3+s[i+1]*0.59+s[i+2]*0.11;const edge=j=>j<0||s[j+3]<250||lum(j)<42;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(s[i+3]<250||lum(i)<42)continue;
    let f=0;if(edge(y>0?i-w*4:-1))f=amt;else if(edge(y<h-1?i+w*4:-1))f=-amt*1.2;else if(edge(x>0?i-4:-1))f=amt*0.5;else if(edge(x<w-1?i+4:-1))f=-amt*0.6;
    if(f>0){for(let k=0;k<3;k++)d[i+k]=s[i+k]+(255-s[i+k])*f;}else if(f<0){for(let k=0;k<3;k++)d[i+k]=s[i+k]*(1+f);}}
  g.putImageData(im,0,0);return c;}
function thinC(c){const w=c.width,h=c.height,g=c.getContext('2d');const im=g.getImageData(0,0,w,h),d=im.data;const s=new Uint8ClampedArray(d);
  const ol=i=>s[i+3]>250&&(s[i]*0.3+s[i+1]*0.59+s[i+2]*0.11)<42;const tr=i=>s[i+3]<10;
  for(let y=2;y<h-2;y++)for(let x=2;x<w-2;x++){const i=(y*w+x)*4;if(!ol(i))continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const o=(dy*w+dx)*4,j=i+o,k=i-o,k2=i-2*o;if(tr(j)&&ol(k)&&!tr(k2)){d[i+3]=0;break;}}}
  g.putImageData(im,0,0);return c;}

function flipC(c){const [f,g]=mk(c.width,c.height);g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return f;}
function whiteC(c){const [f,g]=mk(c.width,c.height);g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);return f;}
function mkS(rows,pal,ax){const r=shadeC(thinC(epx(sprC(rows,pal))),0.16);const w=r.width/2;return {r,l:flipC(r),wr:whiteC(r),wl:null,w,h:r.height/2,ax:ax==null?w/2:ax};}

function genStone(){
  const [c,g]=mk(128,64);const r=rng(77);
  rect(g,0,0,128,64,'#14161d');
  for(let row=0;row<2;row++){
    let x=row?-22:0;
    while(x<128){
      const w=30+Math.floor(r()*22);
      for(const ox of [0,128,-128]){
        const sx=x+ox+2,sy=row*32+2,sw=w-4,sh=28;
        rect(g,sx,sy,sw,sh,'#4b5160');
        for(let i=0;i<sw;i++){const n=r();rect(g,sx+i,sy+3+Math.floor(n*20),1,1,n<.5?'#545a69':'#444a58');}
        rect(g,sx,sy,sw,2,'#7a8092');rect(g,sx,sy+2,sw,2,'#646a7b');rect(g,sx,sy,2,sh,'#656b7c');rect(g,sx+2,sy+2,1,sh-4,'#5a6070');
        rect(g,sx,sy+sh-3,sw,3,'#34373f');rect(g,sx,sy+sh-4,sw,1,'#3e424d');rect(g,sx+sw-3,sy,3,sh,'#363a45');
        for(const [cx,cy] of [[0,0],[sw-1,0],[0,sh-1],[sw-1,sh-1],[1,0],[0,1],[sw-2,0],[sw-1,1],[0,sh-2],[1,sh-1],[sw-1,sh-2],[sw-2,sh-1]])rect(g,sx+cx,sy+cy,1,1,'#14161d');
        for(let i=0;i<14;i++){const px=sx+4+Math.floor(r()*(sw-8)),py=sy+5+Math.floor(r()*(sh-10));rect(g,px,py,1,1,r()<.5?'#6a7080':'#363a44');}
        if(r()<.5){let px=sx+6+Math.floor(r()*(sw-12)),py=sy+6;for(let k=0;k<8;k++){rect(g,px,py,1,1,'#2c2f37');py++;px+=r()<.5?1:0;}}
      }
      x+=w;
    }
  }
  return c;
}

function drawTile(g,c,tx,ty,x,y){
  if(c==='#'){g.drawImage(STONE,(tx*32)%128,(ty*32)%64,32,32,x,y,16,16);return;}
  const v=Math.floor(hash(tx,ty)*12)+tx;const vk=c==='='||c==='R'||c==='|'||c==='^'?0:((v%12)+12)%12;
  const key=c+vk;let t=tileCache[key];

  g.drawImage(t,x,y,16,16);
}

function camClamp(x){const lw=level.w*TS;return lw<=W?(lw-W)/2:clamp(x,0,lw-W);}
function newPlayer(x,y){return {x,y,w:10,h:20,vx:0,vy:0,face:1,onGround:false,anim:0,throwT:0,slashT:0,hurtT:0,invT:0,alive:true,warp:true,slashHit:null,ctrl:false};}
function tileAt(tx,ty){if(tx<0||tx>=level.w)return 'X';if(ty<0||ty>=ROWS)return '.';return level.map[ty][tx];}
const solidAt=(tx,ty)=>SOLID.has(tileAt(tx,ty));
function moveBody(e){
  e.hitWall=false;
  if(e.vx){
    e.x+=e.vx;const y0=Math.floor(e.y/TS),y1=Math.floor((e.y+e.h-0.01)/TS);
    if(e.vx>0){const tx=Math.floor((e.x+e.w-0.01)/TS);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){e.x=tx*TS-e.w;e.hitWall=true;break;}}
    else{const tx=Math.floor(e.x/TS);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){e.x=(tx+1)*TS;e.hitWall=true;break;}}
  }
  const prevB=e.y+e.h;e.y+=e.vy;e.onGround=false;e.groundTile=null;
  const x0=Math.floor(e.x/TS),x1=Math.floor((e.x+e.w-0.01)/TS);
  if(e.vy>=0){const bt=e.y+e.h,ty=Math.floor(bt/TS);
    for(let tx=x0;tx<=x1;tx++){const c=tileAt(tx,ty);if(SOLID.has(c)||(ONEWAY.has(c)&&!e.heavy&&prevB<=ty*TS+0.5)){e.y=ty*TS-e.h;e.vy=0;e.onGround=true;e.groundTile=c;break;}}}
  else{const ty=Math.floor(e.y/TS);for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty)){e.y=(ty+1)*TS;e.vy=0;break;}}
}

function updatePlayer(ctrl){

function updateEnemy(e){
  e.t++;if(e.flash>0)e.flash--;if(e.inv>0)e.inv--;
  const pcx=P.x+P.w/2,ecx=e.x+e.w/2,dx=pcx-ecx,dist=Math.abs(dx),dy=(P.y+P.h)-(e.y+e.h);

  case 'ronin':{
    if(e.state==='walk'){
      if(dist<170)e.face=dx>0?1:-1;
      e.vx=(dist<160&&dist>20)?e.face*0.55:0;
      const ftx=Math.floor((e.face>0?e.x+e.w+2:e.x-2)/TS),fty=Math.floor((e.y+e.h+2)/TS);
      if(e.vx&&!SOLID.has(tileAt(ftx,fty))&&!ONEWAY.has(tileAt(ftx,fty)))e.vx=0;

    } else if(e.state==='wind'){e.vx=0;if(++e.st>=18){e.state='slash';e.st=0;sfx('slash');}}
    else if(e.state==='slash'){e.vx=e.st<4?e.face*1.2:0;
      if(e.st<8){const hb={x:e.face>0?e.x+e.w-2:e.x-18,y:e.y,w:20,h:18};if(overlap(hb,P))hurtPlayer(2);}
      if(++e.st>=20){e.state='cool';e.st=0;}}
    else if(e.state==='cool'){e.vx=0;if(++e.st>=40)e.state='walk';}
    e.vy=Math.min(e.vy+0.26,6);moveBody(e);break;}
  case 'archer':{
    e.face=dx>0?1:-1;e.vx=0;
    if(e.state==='walk'){if(--e.cd<=0&&dist<230){e.state='draw';e.st=0;}}
    else if(e.state==='draw'){if(++e.st>=26){shots.push({type:'arrow',own:'e',x:e.x+e.w/2+e.face*6-5,y:e.y+9,w:10,h:3,vx:e.face*2.6,vy:0,t:0,dmg:1,face:e.face});sfx('throw');e.state='walk';e.cd=90+Math.floor(Math.random()*40);}}
    e.vy=Math.min(e.vy+0.26,6);moveBody(e);break;}
  case 'ninja':{
    if(e.onGround){
      e.vx=0;e.face=dx>0?1:-1;
      if(--e.cd<=0&&dist<200){e.vy=-4.6;e.vx=e.face*(dist>60?1.3:-0.8);e.thrown=false;e.onGround=false;}
    } else if(!e.thrown&&e.vy>-0.5){
      e.thrown=true;const ang=Math.atan2((P.y+P.h/2)-(e.y+8),dx);
      shots.push({type:'eshuri',own:'e',x:ecx-3,y:e.y+6,w:7,h:7,vx:Math.cos(ang)*2.6,vy:Math.sin(ang)*2.6,t:0,dmg:1});sfx('throw');e.throwT=12;
    }
    if(e.throwT>0)e.throwT--;
    const wasG=e.onGround;
    e.vy=Math.min(e.vy+0.24,6);moveBody(e);
    if(e.onGround&&!wasG)e.cd=45+Math.floor(Math.random()*40);
    if(e.y>PH+20){e.dead=true;if(e.spawn)e.spawn.live=false;}
    break;}
  case 'crow':{
    e.x+=e.vx;e.face=e.vx>0?1:-1;
    if(dist<70&&!e.dive){e.dive=true;}
    if(e.dive)e.baseY+=(P.y+6-e.baseY)*0.03;
    e.y=e.baseY+Math.sin(e.t*0.09)*12;
    break;}
  case 'cameo':{
    e.face=dx>0?1:-1;
    if(dist<120&&!e.gone){e.gone=true;smoke(ecx,e.y+10);sfx('smoke');floatText('フフフ…',ecx,e.y-6,'#c080ff');e.dead=true;e.spawn.dead=true;}
    break;}
  case 'boss':updateBoss(e);break;
  case 'hime':case 'shadow':{if(e.update)e.update(e);break;}
  }
  if(!e.dead&&!e.harmless&&e.touch&&P.alive&&overlap(e,P))hurtPlayer(e.state==='dash'?3:e.touch);
  // offscreen cull
  if(e.spawn&&!e.dead&&(e.x<camX-90||e.x>camX+W+90)){e.dead=true;e.spawn.live=false;}
}

// ---------- boss ----------
function makeBoss(){
  return {kind:'boss',heavy:true,x:15*TS,y:160-34,w:22,h:34,vx:0,vy:0,face:-1,hp:28,max:28,flash:0,inv:0,state:'wait',st:0,t:0,touch:2,score:10000,last:'',phase:1};
}
function updateBoss(e){
  const pcx=P.x+P.w/2,ecx=e.x+e.w/2;
  e.st++;
  if(e.phase===1&&e.hp<=14){e.phase=2;floatText('おのれ〜！',ecx,e.y-8,'#ff6060');sfx('roar');G.shake=10;}
  const fast=e.phase===2;
  switch(e.state){
  case 'wait':case 'dead':case 'kneel':e.vx=0;break;
  case 'idle':
    e.vx=0;e.face=pcx>ecx?1:-1;
    if(e.st>(fast?28:48)){
      const opts=['coins','dash','jump'].filter(o=>o!==e.last);
      const n=opts[Math.floor(Math.random()*opts.length)];e.last=n;e.state=n;e.st=0;
      if(n==='jump'){e.vy=-6.4;e.vx=clamp((pcx-ecx)/48,-2.6,2.6);sfx('jump');}
      if(n==='dash')sfx('roar');
    }
    break;
  case 'coins':
    e.vx=0;
    if(e.st===14){const n=fast?5:3;for(let i=0;i<n;i++){shots.push({type:'coin',own:'e',x:ecx-3,y:e.y+4,w:6,h:7,vx:e.face*(0.9+i*0.55),vy:-4.2+i*0.25,g:0.17,t:0,dmg:1});}sfx('item');floatText('小判じゃ！',ecx,e.y-6,'#ffe060');}
    if(fast&&e.st===40){for(let i=0;i<3;i++)shots.push({type:'coin',own:'e',x:ecx-3,y:e.y+4,w:6,h:7,vx:e.face*(1.2+i*0.7),vy:-3.2,g:0.17,t:0,dmg:1});sfx('item');}
    if(e.st>=(fast?60:50)){e.state='idle';e.st=0;}
    break;
  case 'dash':
    if(e.st<30){e.vx=0;}
    else{e.vx=e.face*(fast?4.4:3.4);if(e.hitWall){G.shake=8;sfx('quake');e.state='idle';e.st=0;e.vx=0;}}
    break;
  case 'jump':
    if(e.onGround&&e.st>4){G.shake=10;sfx('quake');
      const by=e.y+e.h-12;shots.push({type:'wave',own:'e',x:ecx-14,y:by,w:10,h:12,vx:-2.6,vy:0,t:0,dmg:2});shots.push({type:'wave',own:'e',x:ecx+4,y:by,w:10,h:12,vx:2.6,vy:0,t:0,dmg:2});
      e.vx=0;e.state='idle';e.st=0;}
    break;
  }
  if(e.state!=='dead'&&e.state!=='kneel'){e.vy=Math.min(e.vy+(e.state==='jump'?0.24:0.3),7);moveBody(e);}
}
function bossDefeated(){

    act(()=>{e.state='kneel';puff(e.x+e.w/2,e.y+e.h,10,'#cccccc');}),
    wait(40),
    say('悪代官','ぐ、ぐぬぬ……\nま、待て！ わしは……\nあの方に 命じられた だけじゃ！'),

    say('疾風','待て！ 逃がすか！'),
    act(()=>{P.face=1;P.throwT=14;sfx('throw');shots.push({type:'shuri',own:'c',x:P.x+P.w/2+4,y:P.y+7,w:7,h:7,vx:0,vy:0,t:0,tx:shadow.x+5,ty:shadow.y+8});}),
    until(()=>!shots.some(s=>s.own==='c')),

    act(()=>{smoke(shadow.x+5,shadow.y+10);smoke(shadow.x+5,shadow.y);sfx('smoke');shadow.dead=true;}),
    wait(40),
    act(()=>{smoke(e.x+e.w/2,e.y+e.h-8);sfx('smoke');e.dead=true;floatText('悪代官を 捕らえた！',160,90,'#ffe080');}),
    wait(50),
    act(()=>{G.cageOpen=true;sfx('clink');hime=makeHime();ents.push(hime);smoke(hime.x+7,hime.y+10);}),
    wait(30),
    until(()=>{const tx=P.x+P.w+6;hime.face=-1;if(hime.x>tx+1){hime.x-=0.8;hime.walk=true;return false;}hime.walk=false;return true;}),
    say('さくら姫','疾風さま……！\n助けて くださって\nありがとうございます。'),
    say('疾風','姫さま、ご無事で なにより。\n……しかし あの 影の忍者、\nいったい 何者だ……。'),
    wait(20),
  ],()=>fadeTo(()=>{G.state='ending';G.endT=0;playSong('calm',true);saveHi();}));
}
function makeShadow(){
  return {kind:'shadow',x:15*TS+3,y:6*TS-20,w:10,h:20,face:-1,t:0,flash:0,inv:0,harmless:true,touch:0,catching:0,update(e){if(e.catching>0)e.catching--;}};
}
function makeHime(){return {kind:'hime',x:9*TS+4,y:160-19,w:12,h:19,face:-1,t:0,flash:0,inv:0,harmless:true,touch:0,walk:false};}

// ---------- scenes ----------
function say(name,text){return {start(){dlg={name,text,n:0,last:0};},update(){
  if(dlg.n<dlg.text.length){dlg.n=Math.min(dlg.text.length,dlg.n+0.55);const ni=Math.floor(dlg.n);if(ni!==dlg.last){dlg.last=ni;const ch=dlg.text[ni-1];if(ch&&ch!==' '&&ch!=='\n'&&ni%2===0)sfx('blip');}
    if(anyPressed()||canvasTap){canvasTap=0;dlg.n=dlg.text.length;}return false;}
  if(anyPressed()||canvasTap){canvasTap=0;dlg=null;return true;}return false;}};}
function wait(n){let t=0;return {start(){t=0;},update(){return ++t>=n;}};}
function act(fn){return {start(){fn();},update(){return true;}};}
function until(pred){return {start(){},update:pred};}
function runScene(steps,onDone){scene={steps,i:0,started:false,onDone};}
function updateScene(){
  if(!scene)return;
  const s=scene.steps[scene.i];
  if(!scene.started){scene.started=true;s.start();}
  if(s.update()){scene.i++;scene.started=false;if(scene.i>=scene.steps.length){const d=scene.onDone;scene=null;if(d)d();}}
}
function fadeTo(cb){G.fadeDir=1;G.fadeCb=cb;}

// ---------- flow ----------
function loadStage(i,useCp){
  G.stage=i;level=STAGES[i]();
  level.spawnState=level.spawns.map(d=>({d,dead:false,live:false}));
  if(G.takenLives)for(const s of level.spawnState)if(s.d[0]==='item:life'&&G.takenLives.has(i+':'+s.d[1]))s.dead=true;
  ents=[];shots=[];items=[];fx=[];dlg=null;scene=null;boss=null;hime=null;shadow=null;G.cageOpen=false;G.bossBar=0;G.bossFill=false;
  if(!useCp)G.cp=null;
  const sx=(useCp&&G.cp!=null)?G.cp:level.start;
  P=newPlayer(sx*TS+3,-60);
  camX=camClamp(P.x+P.w/2-W/2);
  G.state='ready';G.readyT=0;G.paused=false;
  if(level.boss){
    boss=makeBoss();ents.push(boss);
    level.onLand=()=>{G.state='scene';runScene([
      wait(20),
      say('悪代官','フハハハ！ よくぞ ここまで\nたどり着いたな、小僧！'),
      say('疾風','悪代官・黒田玄蕃！\nさくら姫を 返してもらう！'),
      say('さくら姫','疾風さま……！'),
      say('悪代官','姫は わしのものじゃ！\nこの 黄金の力で\nねじ伏せて くれるわ！'),
      act(()=>{G.bossFill=true;sfx('roar');}),
      until(()=>G.bossBar>=boss.max),
      act(()=>{G.state='play';boss.state='idle';boss.st=0;playSong('boss',true);}),
    ]);};
  }
  if(level.music)playSong(level.music);else stopSong();
}
function newGame(){
  G.score=0;G.lives=3;G.hp=8;G.shuri=15;G.bombs=2;G.cp=null;G.takenLives=new Set();G.newHi=false;
  G.state='story';
  playSong('calm');
  runScene([
    say('','時は 江戸。\n月の 美しい 夜のこと。'),
    say('','城下を 牛耳る 悪代官・黒田玄蕃が\n藩主の娘 さくら姫を さらい\n屋敷の奥に 閉じこめた。'),
    say('','姫を 救えるのは ただひとり。\n若き 忍び・疾風（はやて）！'),
    say('疾風','姫さま、いま 参ります！'),
  ],()=>fadeTo(()=>loadStage(0,false)));
}
function saveHi(){if(G.score>HI){HI=G.score;G.newHi=true;try{localStorage.setItem('hayate_hi',''+HI);}catch(e){}}}

function updateWorld(ctrl){
  updatePlayer(ctrl);
  spawnCheck();
  for(const e of ents)if(!e.dead)updateEnemy(e);
  ents=ents.filter(e=>!e.dead||e===boss&&false);
  // shots
  for(const s of shots){
    if(s.dead)continue;s.t++;
    if(s.type==='bomb'){s.vy+=0.2;s.x+=s.vx;s.y+=s.vy;
      let hit=s.t>70||solidAt(Math.floor((s.x+4)/TS),Math.floor((s.y+s.h)/TS));
      for(const e of ents)if(!e.harmless&&!e.dead&&overlap(s,e))hit=true;
      if(hit){s.dead=true;explode(s.x+4,s.y+5);}continue;}
    if(s.own==='c'){const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy);if(d<5){s.dead=true;continue;}s.x+=dx/d*4.5;s.y+=dy/d*4.5;continue;}
    if(s.g)s.vy+=s.g;
    s.x+=s.vx;s.y+=s.vy;
    if(s.type==='wave'){if(s.x<TS||s.x+s.w>(level.w-1)*TS)s.dead=true;}
    else if(solidAt(Math.floor((s.x+s.w/2)/TS),Math.floor((s.y+s.h/2)/TS))){s.dead=true;addFx('spark',s.x+s.w/2,s.y+s.h/2,{life:8});if(s.type==='coin')sfx('clink');continue;}
    if(s.x<camX-40||s.x>camX+W+40||s.y>PH+20||s.y<-60)s.dead=true;
    if(s.own==='p'){for(const e of ents){if(e.dead||e.harmless)continue;if(overlap(s,e)){if(hitEnemy(e,s.dmg)){s.dead=true;addFx('spark',s.x+3,s.y+3,{life:8});}else if(e.kind==='boss'){s.dead=true;sfx('clink');}break;}}}
    else if(s.own==='e'&&P.alive&&overlap(s,P)){hurtPlayer(s.dmg);if(s.type!=='wave')s.dead=true;}
  }
  shots=shots.filter(s=>!s.dead);
  // items
  for(const it of items){
    it.t++;
    it.vy=Math.min(it.vy+0.2,4);const ob={x:it.x,y:it.y,w:it.w,h:it.h,vx:0,vy:it.vy};moveBody(ob);it.y=ob.y;it.vy=ob.vy;
    if(it.drop&&it.t>420)it.dead=true;
    if(it.y>PH+10)it.dead=true;
    if(P.alive&&!P.warp&&overlap(it,P)){it.dead=true;pickup(it);}
  }
  items=items.filter(i=>!i.dead);
  for(const f of fx){f.t++;f.x+=f.vx;f.y+=f.vy;if(f.type==='smoke'){f.vx*=0.94;f.vy*=0.94;}}
  fx=fx.filter(f=>f.t<f.life);
  // camera
  if(P.alive)camX=camClamp(Math.round(P.x+P.w/2-W/2));
  // checkpoints / goal
  for(const c of level.cps)if(P.x>c*TS&&(G.cp==null||G.cp<c))G.cp=c;
  if(level.goal&&G.state==='play'&&P.x+P.w/2>level.goal&&P.onGround){G.state='clear';G.clearT=0;stopSong();sfx('start');}
  if(G.shake>0)G.shake--;if(G.flash>0)G.flash--;
}
function explode(x,y){
  boomFx(x,y,true);sfx('boom');G.shake=10;
  for(const e of ents){if(e.dead||e.harmless)continue;const d=Math.hypot(e.x+e.w/2-x,e.y+e.h/2-y);if(d<36)hitEnemy(e,e.kind==='boss'?4:5);}
  for(const s of shots)if(s.own==='e'&&Math.hypot(s.x-x,s.y-y)<40){s.dead=true;}
}
function pickup(it){
  if(it.spawn)it.spawn.dead=true;
  G.score+=50;
  switch(it.kind){
    case 'shuri':G.shuri=Math.min(99,G.shuri+5);sfx('item');floatText('手裏剣 +5',it.x+4,it.y-4);break;
    case 'oni':G.hp=Math.min(8,G.hp+3);sfx('item');floatText('じんりょく +3',it.x+4,it.y-4,'#ff9090');break;
    case 'bomb':G.bombs=Math.min(9,G.bombs+1);sfx('item');floatText('焙烙玉 +1',it.x+4,it.y-4,'#ffd080');break;
    case 'life':G.lives=Math.min(9,G.lives+1);sfx('life');floatText('1UP',it.x+4,it.y-4,'#80ff80');G.takenLives.add(G.stage+':'+it.spawn.d[1]);break;
  }
}

// ================= main update =================
function update(){
  G.t++;
  if(G.fadeDir){
    G.fade+=G.fadeDir*0.06;
    if(G.fadeDir>0&&G.fade>=1){G.fade=1;const cb=G.fadeCb;G.fadeCb=null;G.fadeDir=-1;if(cb)cb();}
    else if(G.fadeDir<0&&G.fade<=0){G.fade=0;G.fadeDir=0;}
    if(G.fadeDir>0){Object.assign(prev,keys);for(const k in latch)latch[k]=0;return;}
  }
  switch(G.state){
  case 'title':
    G.titleT++;
    if(G.titleT>20&&(anyPressed()||canvasTap)){canvasTap=0;sfx('start');newGame();}
    break;
  case 'story':updateScene();break;
  case 'ready':
    if(++G.readyT>100){G.state='play';sfx('warp');}
    break;
  case 'play':
    if(pressed('start')){G.paused=!G.paused;sfx('pause');}
    if(!G.paused)updateWorld(true);
    break;
  case 'scene':
    updateScene();
    if(G.bossFill&&G.bossBar<boss.max&&G.t%3===0){G.bossBar++;sfx('fill');}
    updateWorld(false);
    break;
  case 'clear':
    G.clearT++;P.vx=0;
    for(const f of fx){f.t++;f.x+=f.vx;f.y+=f.vy;}fx=fx.filter(f=>f.t<f.life);
    if(G.clearT===110)fadeTo(()=>loadStage(G.stage+1,false));
    break;
  case 'dying':
    G.dieT++;
    for(const f of fx){f.t++;f.x+=f.vx;f.y+=f.vy;}fx=fx.filter(f=>f.t<f.life);
    if(G.dieT===130)fadeTo(()=>{
      G.lives--;
      if(G.lives<=0){G.state='gameover';G.goT=0;saveHi();playSong('calm',true);}
      else{G.hp=8;G.shuri=Math.max(G.shuri,10);loadStage(G.stage,true);}
    });
    break;
  case 'gameover':
    G.goT++;
    if(G.goT>40&&(anyPressed()||canvasTap)){canvasTap=0;sfx('start');fadeTo(()=>{G.lives=3;G.hp=8;G.score=0;G.shuri=15;G.bombs=Math.max(G.bombs,2);loadStage(G.stage,false);});}
    break;
  case 'ending':
    G.endT++;
    if(G.endT>240&&(anyPressed()||canvasTap)){canvasTap=0;fadeTo(()=>{G.state='title';G.titleT=0;playSong('calm',true);});}
    break;
  }
  canvasTap=0;
  Object.assign(prev,keys);for(const k in latch)latch[k]=0;
}
// ================= rendering =================
const TXT=[];
function txt(s,x,y,o){o=o||{};TXT.push({s,x,y,size:o.size||8,color:o.color||'#ffffff',align:o.align||'left',shadow:o.shadow!==false,outline:o.outline||null,sc:o.sc||'#000000'});}
const pad6=n=>String(Math.max(0,Math.min(999999,n|0))).padStart(6,'0');
function drawBlade(hx,hy,a,face,L){
  const ex=hx+Math.cos(a)*L*face,ey=hy+Math.sin(a)*L;
  const bx=hx-Math.cos(a)*3*face,by=hy-Math.sin(a)*3;
  lineH(b,bx,by,hx,hy,'#3a2a2a');lineH(b,bx,by+0.5,hx,hy+0.5,'#5a3a2a');
  lineH(b,hx,hy,ex,ey,'#cfd8ea');lineH(b,hx,hy+0.5,ex,ey+0.5,'#8a94aa');
  lineH(b,hx+Math.cos(a)*L*0.6*face,hy+Math.sin(a)*L*0.6,ex,ey,'#ffffff');
}
function drawWater(cx){
  const y0=192;
  rect(b,cx,y0,W+2,PH-y0,'#0b1858');rect(b,cx,y0,W+2,0.5,'#3a54c0');rect(b,cx,y0+0.5,W+2,0.5,'#1a2c88');
  for(let r=1;r<32;r++){
    const sp=(r%2?0.2:-0.14)*(1+r*0.02),off=Math.floor(G.t*sp+r*7),o10=((off%10)+10)%10;
    const col=r<8?'#5a7ae8':(r<18?'#3452c4':'#253ca8');
    for(let i=Math.floor(cx/10)-1;i<=Math.floor((cx+W)/10)+1;i++){
      const idx=i-Math.floor(off/10),h=hash(idx,r);
      if(h<0.32)rect(b,i*10+o10,y0+r*0.5,1+Math.floor(h*14)/2,0.5,col);
    }
  }

  genTown();genHouse();genBossRoom();if(level&&P&&level.map.length)camX=camClamp(P.x+P.w/2-W/2);resize();}
function resize(){
  if(isTouch){clearTimeout(wTimer);wTimer=setTimeout(refitW,200);}
  const de=document.documentElement;const vw=Math.min(window.innerWidth,de.clientWidth||9999),vh=Math.min(window.innerHeight,de.clientHeight||9999);
  app.classList.toggle('touch',isTouch);de.classList.toggle('touch',isTouch);
  const land=isTouch&&vw>vh;app.classList.toggle('land',land);
  let cw,ch;
  if(isTouch){const kc=Math.max(vw/W,vh/H),kf=Math.min(vw/W,vh/H);const k=kc/kf<1.04?kc:kf;cw=W*k;ch=H*k;}
  else{const aw=vw-32,ah=vh-54;cw=Math.max(200,Math.min(aw,ah*W/H));if(cw>=640)cw=Math.floor(cw/W)*W;}
  cw=Math.ceil(cw);ch=Math.ceil(cw*H/W);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  // touch: cover the whole screen; any overflow is trimmed from the sides, or from the bottom so the HUD stays visible
  cv.style.position=isTouch?'absolute':'';cv.style.left=isTouch?Math.round((vw-cw)/2)+'px':'';cv.style.top=isTouch?Math.max(0,Math.round((vh-ch)/2))+'px':'';
  const dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
}
resize();addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));addEventListener('load',resize);setTimeout(resize,300);
let acc=0,lastT=performance.now();
function frame(now){
  const dt=Math.min(100,now-lastT);lastT=now;acc+=dt;let n=0;
  while(acc>=1000/60&&n<4){update();acc-=1000/60;n++;}
  if(n>=4)acc=0;
  render();requestAnimationFrame(frame);
}

Promise.race([fontP,new Promise(r=>setTimeout(r,2500))]).then(boot,boot);
