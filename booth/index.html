<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AI mania inc. の展示会ブース3Dデザイン見本。島小間・角小間・並列小間の3案を、カラー・インテリア・白模型・寸法表示で切り替えて確認できます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AI mania inc.">
<meta property="og:title" content="展示会ブース3D｜AI mania inc.">

<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>展示会ブース3D｜AI mania inc.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Cormorant+Garamond:wght@600&family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 上に案の切り替え、左に大きな3Dビューア、右に仕様と切り替えパネル。設計レビューツールらしい白と紺の画面 */
:root{
  --bg:#F5F6F8; --paper:#FFFFFF; --ink:#16202E; --muted:#6A7383; --line:#E1E5EB; --soft:#EEF1F5;
  --navy:#1F3A5F; --accent:#FFD21F;
  --jp:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --latin:'Archivo','Zen Kaku Gothic New',system-ui,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:14px}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #4C8DFF;outline-offset:2px}
.top{background:var(--paper);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.top .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;max-width:1600px;margin:0 auto}
.brand b{display:block;font-family:var(--latin);font-weight:800;font-size:19px;letter-spacing:.08em}
.brand span{display:block;margin-top:3px;font-family:var(--latin);font-weight:600;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--navy)}
.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 360px;max-width:1600px;margin:0 auto}
.viewer{position:relative;min-width:0;background:var(--soft)}
.views{position:absolute;z-index:2;top:14px;left:14px;right:14px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.vbtn{pointer-events:auto;border:1px solid var(--line);background:rgba(255,255,255,.94);border-radius:6px;padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(22,32,46,.06)}
.vbtn:hover{border-color:var(--navy)}
.vbtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.view{position:relative;height:calc(100vh - 72px);min-height:560px;touch-action:none}
.view canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dim{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid #C9D0DA;border-radius:4px;padding:3px 8px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink);box-shadow:0 1px 3px rgba(22,32,46,.12)}
.hint{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:12px;line-height:1.7;color:var(--muted)}
.unit{position:absolute;right:14px;bottom:14px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:12px;font-weight:700}
.load{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted);text-align:center;padding:24px}
.panel{background:var(--paper);border-left:1px solid var(--line);padding:22px 22px 28px;display:flex;flex-direction:column;gap:22px;min-width:0}
.panel h2{margin:0;font-size:21px;font-weight:700;line-height:1.4}
.lead{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.75}
.chip{display:inline-block;margin-top:12px;background:#EEF3FA;color:var(--navy);border-radius:4px;padding:4px 9px;font-size:11.5px;font-weight:700}
.sec{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 10px;letter-spacing:.04em}
hr{border:0;border-top:1px solid var(--line);margin:0}
dl.spec{margin:0;display:grid;grid-template-columns:1fr auto;gap:9px 12px;font-size:13px}
dl.spec dt{color:#4A5363}
dl.spec dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.note{margin:10px 0 0;font-size:11.5px;color:var(--muted);line-height:1.6}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:11px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.sub{margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.sw{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sw button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700}
.sw button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.sw i{display:block;width:100%;aspect-ratio:1.5;border-radius:4px}
.mood{display:flex;flex-direction:column;gap:8px}
.mood button{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 11px;cursor:pointer}
.mood button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.mood b{display:block;font-size:14px}
.mood small{display:block;color:var(--muted);font-size:11.5px;line-height:1.45;margin-top:2px}
.mood i{width:40px;height:40px;border-radius:5px}
.checks{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.checks label{display:flex;align-items:center;gap:11px;cursor:pointer;font-size:14px}
.checks input{width:19px;height:19px;accent-color:var(--navy);margin:0}
@media (max-width:1100px){.stage{grid-template-columns:minmax(0,1fr)}.view{height:68vh;min-height:380px}.panel{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
@media (max-width:560px){.hint{display:none}.tab{padding:8px 11px;font-size:13px}.vbtn{padding:7px 10px;font-size:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="in">
  <div class="brand"><b><a href="/" style="color:inherit;text-decoration:none">AI MANIA INC.</a></b><span>3D BOOTH DESIGN ／ A・B・C 比較 ／ 見本</span></div>
  <div class="tabs" role="group" aria-label="レイアウト">
    <button class="tab" data-layout="island" aria-pressed="true">A案・島小間</button>
    <button class="tab" data-layout="corner" aria-pressed="false">B案・角小間</button>
    <button class="tab" data-layout="line" aria-pressed="false">C案・並列小間</button>
  </div>
</div></header>

<main class="stage">
  <section class="viewer">
    <div class="views" role="group" aria-label="視点">
      <button class="vbtn" data-view="persp" aria-pressed="true">斜め全景</button>
      <button class="vbtn" data-view="front" aria-pressed="false">正面</button>
      <button class="vbtn" data-view="top" aria-pressed="false">真上</button>
      <button class="vbtn" data-view="eye" aria-pressed="false">来場者目線</button>
      <button class="vbtn" data-view="back" aria-pressed="false">背面</button>
      <button class="vbtn" data-view="sign" aria-pressed="false">看板を見上げる</button>
      <button class="vbtn" id="spinBtn" aria-pressed="false">自動で回す</button>
    </div>
    <div class="view" id="view">
      <div class="load" id="load">ブースを組み立てています…</div>
      <div id="labels"></div>
      <div class="hint">ドラッグ：回転　ホイール：拡大縮小<br>右ドラッグ：平行移動</div>
      <div class="unit" id="unitBadge">A案 ／ 単位 mm</div>
    </div>
  </section>

  <aside class="panel">
    <div>
      <h2 id="planName">A案：島小間</h2>
      <p class="lead" id="planLead"></p>
      <span class="chip" id="planChip"></span>
    </div>
    <hr>
    <div>
      <p class="sec">寸法 ／ mm</p>
      <dl class="spec" id="spec"></dl>
      <p class="note">1小間＝2,970 × 2,970 mm で計算した見本です。グラフィックと造作は架空のものです。</p>
    </div>
    <hr>
    <div>
      <p class="sec">カラー</p>
      <div class="sw" id="colorBtns" role="group" aria-label="カラーパターン"></div>
    </div>
    <div>
      <p class="sec">インテリア</p>
      <div class="mood" id="moodBtns" role="group" aria-label="インテリアの雰囲気"></div>
    </div>
    <hr>
    <div>
      <p class="sec">表示</p>
      <div class="seg" role="group" aria-label="表示モード">
        <button id="modeDesign" aria-pressed="true">デザイン</button>
        <button id="modeWhite" aria-pressed="false">白模型</button>
      </div>
      <p class="sub" id="modeSub"></p>
      <div class="checks">
        <label><input type="checkbox" id="chkGlow" checked>照明の発光表現</label>
        <label><input type="checkbox" id="chkSign" checked>リング看板と支柱</label>
        <label><input type="checkbox" id="chkDims" checked>主要寸法</label>
        <label><input type="checkbox" id="chkPeople" checked>人物目安（約1,700 mm）</label>
        <label><input type="checkbox" id="chkNeighbors" checked>周辺のブース・通路</label>
      </div>
    </div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
(function(){
const T=THREE;
const INK='#1D1D1F',YEL='#FFD21F',BLU='#2F5BEA',RED='#FF4B3A',GRN='#19C25F',PNK='#FF8DEA';
const FIVE=[BLU,YEL,RED,GRN,PNK];
const KOMA=2.97, CP=0.012;
const TAU=Math.PI*2;
const LAYOUTS={
  island:{key:'A',name:'A案：島小間',koma:4,W:KOMA*2,D:KOMA*2,open:'4面',
    lead:'四方が通路に面する4小間。高さ2,400の曲面壁を3枚に分けて回遊できる動線をつくり、直径4,580のリング看板を、曲面壁の上から立ち上がる6本の支柱で支えます（天井から吊らない仕様）。'},
  corner:{key:'B',name:'B案：角小間',koma:2,W:KOMA*2,D:KOMA,open:'2面（正面・右側）',
    lead:'通路の角に立つ2小間。奥と左を半径1,200の曲面でつなぎ、その曲面壁から立ち上がる支柱でリング看板を載せます。'},
  line:{key:'C',name:'C案：並列小間',koma:3,W:KOMA*3,D:KOMA,open:'1面（正面）',
    lead:'3小間を横に並べた構成。奥壁を半径8,600のゆるい曲面にして幅3,800の湾曲LEDを埋め込み、裏側をストックヤードにします。看板は奥壁と床からの支柱で支えます。'}
};
const PALS={
  blue:{name:'ブルー',g1:'#0A2F7A',g2:'#1D7FD8',g3:'#58C7F3',ink:'#FFFFFF',carpet:'#1F59C9',band:'#0B2E6E',bandInk:'#FFFFFF',acc:['#8FE9FF','#FFFFFF',YEL],edge:'#8FE9FF',cap:'#0B2E6E',light:true},
  yellow:{name:'イエロー',g1:'#FFC21A',g2:'#FFD84D',g3:'#FFF0A8',ink:'#1D1D1F',carpet:'#2B2C30',band:'#1D1D1F',bandInk:YEL,acc:['#1D1D1F','#FFFFFF',BLU],edge:'#FFE58A',cap:'#1D1D1F'},
  red:{name:'レッド',g1:'#8E0F18',g2:'#E2352C',g3:'#FF8A6E',ink:'#FFFFFF',carpet:'#9C1820',band:'#FFFFFF',bandInk:'#C8202A',acc:['#FFFFFF',YEL,'#FFC2B6'],edge:'#FFB3A6',cap:'#FFFFFF',light:true},
  five:{name:'5色',g1:'#FFFFFF',g2:'#F2F4F8',g3:'#E6ECF5',ink:'#1D1D1F',carpet:'#2F5BEA',band:'#FFFFFF',bandInk:'#1D1D1F',acc:FIVE,edge:'#FFFFFF',cap:'#1D1D1F',stripe:true},
  mono:{name:'モノ',g1:'#141518',g2:'#2C2E33',g3:'#4A4D55',ink:'#F3EFE4',carpet:'#2A2B2F',band:'#F3EFE4',bandInk:'#1D1D1F',acc:['#F3EFE4','#9A968C',YEL],edge:'#F3EFE4',cap:'#F3EFE4',light:true}
};
const MOODS={
  natural:{name:'ナチュラル',desc:'オーク材・リネン・観葉植物・電球色',sw:'linear-gradient(135deg,#C79A6B 0 50%,#6F8A5B 50%)',base:'wood',top:'#FBFAF7',wood:'#C79A6B',fabric:'#D9D0BF',metal:'#B08D57',plants:2,light:0xffdcb5,lightName:'電球色 3,000K'},
  minimal:{name:'ミニマル',desc:'白い天板・アルミ・ガラス・昼白色',sw:'linear-gradient(135deg,#F4F5F7 0 50%,#AEB6C2 50%)',base:'white',top:'#FFFFFF',wood:'#EDEEF0',fabric:'#E3E6EB',metal:'#C9CED6',plants:0,light:0xf3f7ff,lightName:'昼白色 5,000K'},
  industrial:{name:'インダストリアル',desc:'黒皮鉄・ウォールナット・レザー・琥珀色',sw:'linear-gradient(135deg,#2B2C30 0 50%,#6B4630 50%)',base:'black',top:'#5A3D2B',wood:'#5A3D2B',fabric:'#8A5A3B',metal:'#2B2C30',plants:1,light:0xffcf96,lightName:'琥珀色 2,700K'}
};
const state={layout:'island',pal:'blue',mood:'minimal',white:false,glow:true,sign:true,dims:true,people:true,neighbors:true,spin:false,view:'persp'};

const $=s=>document.querySelector(s);
const colorBtns=$('#colorBtns'),moodBtns=$('#moodBtns');
Object.entries(PALS).forEach(([k,p])=>{const b=document.createElement('button');b.dataset.pal=k;b.setAttribute('aria-pressed',k===state.pal);
  const bg=p.stripe?'linear-gradient(90deg,'+FIVE.map((c,i)=>c+' '+i*20+'% '+(i+1)*20+'%').join(',')+')':'linear-gradient(160deg,'+p.g1+','+p.g2+' 60%,'+p.carpet+' 60%)';
  b.innerHTML='<i style="background:'+bg+';box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)"></i>'+p.name;colorBtns.appendChild(b);});
Object.entries(MOODS).forEach(([k,m])=>{const b=document.createElement('button');b.dataset.mood=k;b.setAttribute('aria-pressed',k===state.mood);
  b.innerHTML='<i style="background:'+m.sw+'"></i><span><b>'+m.name+'</b><small>'+m.desc+'</small></span>';moodBtns.appendChild(b);});
function press(sel,attr,val){document.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[attr]===val)));}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(state.layout===b.dataset.layout)return;state.layout=b.dataset.layout;press('.tab','layout',state.layout);rebuild(true);}));
colorBtns.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.pal=b.dataset.pal;press('#colorBtns button','pal',state.pal);rebuild(false);});
moodBtns.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.mood=b.dataset.mood;press('#moodBtns button','mood',state.mood);rebuild(false);});
document.querySelectorAll('.vbtn[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;press('.vbtn[data-view]','view',state.view);goView(state.view,true);}));
$('#spinBtn').addEventListener('click',e=>{state.spin=!state.spin;e.currentTarget.setAttribute('aria-pressed',state.spin);if(window._ctl)window._ctl.autoRotate=state.spin;});
function setWhite(w){state.white=w;$('#modeDesign').setAttribute('aria-pressed',!w);$('#modeWhite').setAttribute('aria-pressed',w);applyToggles();updateSpec();}
$('#modeDesign').addEventListener('click',()=>setWhite(false));$('#modeWhite').addEventListener('click',()=>setWhite(true));
[['chkGlow','glow'],['chkSign','sign'],['chkDims','dims'],['chkPeople','people'],['chkNeighbors','neighbors']].forEach(([id,k])=>$('#'+id).addEventListener('change',e=>{state[k]=e.target.checked;applyToggles();}));

const view=$('#view'),labelsEl=$('#labels'),loadEl=$('#load');
let okGL=false;try{const t=document.createElement('canvas');okGL=!!(t.getContext('webgl')||t.getContext('experimental-webgl'));}catch(e){}
if(!window.THREE||!okGL||!T.OrbitControls||!T.RoundedBoxGeometry){loadEl.textContent='この端末では3D表示が使えません。パソコンの Chrome・Safari・Edge で開いてください。';updateSpec();return;}

const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
view.insertBefore(renderer.domElement,labelsEl);
const scene=new T.Scene();
const pmrem=new T.PMREMGenerator(renderer);const envTex=pmrem.fromScene(new T.RoomEnvironment(),.04).texture;scene.environment=envTex;
scene.background=new T.Color('#E7EAEE');scene.fog=new T.Fog('#E7EAEE',26,70);
const camera=new T.PerspectiveCamera(36,1,.05,200);
const controls=new T.OrbitControls(camera,renderer.domElement);window._ctl=controls;
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI*.497;controls.minDistance=1.2;controls.maxDistance=40;controls.autoRotateSpeed=.6;controls.screenSpacePanning=true;
let userMoved=false,camTween=null;controls.addEventListener('start',()=>{camTween=null;userMoved=true;});

const hemi=new T.HemisphereLight(0xffffff,0xb9b5ac,.18);scene.add(hemi);
const sun=new T.DirectionalLight(0xffffff,1.15);sun.position.set(5,14,7);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:2,far:40});sun.shadow.bias=-.0003;sun.shadow.normalBias=.02;sun.shadow.radius=4;scene.add(sun);
const fill=new T.DirectionalLight(0xdfe8ff,.25);fill.position.set(-8,6,-6);scene.add(fill);

const col=c=>new T.Color(c).convertSRGBToLinear();
const maxAniso=renderer.capabilities.getMaxAnisotropy();
function canvasTex(w,h,draw,o){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new T.CanvasTexture(c);
  t.encoding=(o&&o.linear)?T.LinearEncoding:T.sRGBEncoding;t.anisotropy=maxAniso;if(o&&o.rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(o.rep[0],o.rep[1]);}return t;}
function rnd(s){const x=Math.sin(s*9301+49297)*233280;return x-Math.floor(x);}

const hallTex=canvasTex(1024,1024,(g,w,h)=>{g.fillStyle='#B4B2AD';g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){const v=150+Math.random()*80;g.fillStyle='rgba('+v+','+v+','+(v-4)+','+(.05+Math.random()*.08)+')';const r=Math.random()*3;g.fillRect(Math.random()*w,Math.random()*h,r,r);}
  for(let i=0;i<14;i++){g.fillStyle='rgba(120,118,112,.05)';g.beginPath();g.ellipse(Math.random()*w,Math.random()*h,60+Math.random()*160,40+Math.random()*90,Math.random()*3,0,TAU);g.fill();}
  g.fillStyle='rgba(90,88,84,.5)';g.fillRect(0,0,w,3);g.fillRect(0,0,3,h);},{rep:[40,40]});
const hall=new T.Mesh(new T.PlaneGeometry(120,120),new T.MeshStandardMaterial({map:hallTex,roughness:.38,metalness:0,envMapIntensity:.6}));

  if(state.layout==='line'){
    const H=2.7,th=.14,R=8.6;const cz=-hz+.06+R;const tEdge=Math.asin((hx-.06)/R);
    arcWall(B,{cx:0,cz,r:R,th,t0:Math.PI-tEdge,t1:Math.PI+tEdge,h:H,inner:wrapGraphic(R*2*tEdge,H,P,'head',31),outer:null,capMat,bodyMat});
    const zEnd=cz-R*Math.cos(tEdge);
    [-1,1].forEach(s=>{const z0=zEnd-.05,z1=.75;rbox(B,th,H,z1-z0,.005,bodyMat,s*(hx-th/2),CP,(z0+z1)/2);
      add(B,new T.PlaneGeometry(z1-z0,H),new T.MeshStandardMaterial({map:wrapGraphic(z1-z0,H,P,s<0?'svc':'mog',33+s),roughness:.55}),s*(hx-th-.001),CP+H/2,(z0+z1)/2,{ry:-s*Math.PI/2,wm:'wall',noCast:true});
      cyl(B,th/2,th/2,H,capMat,s*(hx-th/2),CP,z1,24,{wm:'trim'});});
    arcScreen(B,0,cz,R-th,Math.PI-.22,Math.PI+.22,.62,1.75,0,true);spec.screens.push('湾曲LED 3,800×1,750');
    counter(B,0,.95,0,1.8,MT,P);
    roundTable(B,-1.7,.35,MT,1);roundTable(B,1.7,.35,MT,3);spec.tables=2;
    showcase(B,-3.95,.95,.4,MT,P,1);showcase(B,3.95,.95,-.4,MT,P,2);spec.cases=2;
    demoStand(B,-3.2,-.35,.6,MT,1);demoStand(B,3.2,-.35,-.6,MT,2);spec.games=2;
    if(Md.base!=='white'){sofa(B,2.4,-.95,0,1.5,MT);spec.seats=3;}else{meeting(B,2.3,-.75,2,MT,Md,Math.PI/2);spec.seats=2;}
    if(Md.plants){plant(B,-2.35,-.95,1,3);if(Md.plants>1)plant(B,4.0,-.2,.9,9);}
    ringSign(groups.sign,0,-hz+.13+1.44,1.5,2.95,.75,P,false,[[Math.PI,CP+H],[Math.PI-.38,CP+H],[Math.PI+.38,CP+H],[.75,CP],[-.75,CP]]);spec.signD=3.0;spec.maxH=3.7;spec.wallH=H;
    if(state.neighbors){neighbor(groups.nb,-hx-KOMA,0,KOMA*2,D,['back','left']);neighbor(groups.nb,hx+KOMA,0,KOMA*2,D,['back','right']);neighbor(groups.nb,0,-hz-KOMA/2-.05,W,KOMA,['back']);}
    dim([-hx,CP,hz+.7],[hx,CP,hz+.7],mm(W));dim([hx+.7,CP,-hz],[hx+.7,CP,hz],mm(D));
    dim([-hx+.35,CP,zEnd+.25],[-hx+.35,CP+H,zEnd+.25],mm(H));dim([1.5+.3,CP,-hz+.13+1.44],[1.5+.3,3.7,-hz+.13+1.44],mm(3.7));
    person(groups.people,-.6,2.2,Math.PI-.2,'#8C97A6');person(groups.people,1.2,1.0,2.6,'#86909F',1);person(groups.people,-2.4,.6,-2.6,'#7F8A99');person(groups.people,3.4,2.4,-2.6,'#8A93A1',1);
  }
  const amb=new T.PointLight(Md.light,.6,10,2);amb.position.set(0,2.6,0);amb.userData.glow=true;B.add(amb);
  curSpec=spec;
  root.traverse(o=>{if(o.isMesh&&!o.userData.keep)o.userData.design=o.material;});
  applyToggles();updateSpec();
}
const WM_WALL=new T.MeshStandardMaterial({color:col('#F4F4F2'),roughness:.85}),WM_DARK=new T.MeshStandardMaterial({color:col('#9A9EA5'),roughness:.8}),WM_SIGN=new T.MeshStandardMaterial({color:col('#E7E8EA'),roughness:.85}),
  WM_FLOOR=new T.MeshStandardMaterial({color:col('#DADCE0'),roughness:.95}),WM_GLASS=new T.MeshStandardMaterial({color:col('#ffffff'),roughness:.1,transparent:true,opacity:.25,depthWrite:false});
const WM=new Set([WM_WALL,WM_DARK,WM_SIGN,WM_FLOOR,WM_GLASS]);
function disposeRoot(){if(!root)return;scene.remove(root);const seen=new Set();
  root.traverse(o=>{if(o.geometry)o.geometry.dispose();[o.material,o.userData.design].forEach(m=>{if(!m||WM.has(m)||seen.has(m))return;seen.add(m);['map','emissiveMap'].forEach(k=>{const t=m[k];if(t&&!KEEP.has(t)&&!Object.values(woodTexCache).includes(t))t.dispose();});m.dispose();});});
  labelsEl.innerHTML='';dimList=[];animTex=[];root=null;}
function rebuild(reset){disposeRoot();build();if(reset){state.view='persp';press('.vbtn[data-view]','view','persp');goView('persp',true);}}
function applyToggles(){if(!root)return;
  groups.sign.visible=state.sign;groups.dims.visible=state.dims;groups.people.visible=state.people;groups.nb.visible=state.neighbors;labelsEl.style.display=state.dims?'':'none';
  root.traverse(o=>{if(o.isLight&&o.userData.glow)o.visible=state.glow&&!state.white;
    if(o.isMesh&&o.userData.design){const k=o.userData.wm;
      if(state.white)o.material=(k==='dark'||k==='screen')?WM_DARK:k==='sign'?WM_SIGN:k==='floor'?WM_FLOOR:k==='glass'?WM_GLASS:WM_WALL;
      else{o.material=o.userData.design;if(k==='strip')o.material.emissiveIntensity=state.glow?(o.material.transparent?.9:2.4):0;}}});
  $('#unitBadge').textContent=LAYOUTS[state.layout].key+'案 ／ 単位 mm';}
function updateSpec(){const L=LAYOUTS[state.layout],P=PALS[state.pal],Md=MOODS[state.mood],s=curSpec.W?curSpec:{W:L.W,D:L.D,maxH:0,wallH:0,screens:[],games:0,seats:0,cases:0,tables:0,signD:0};
  $('#planName').textContent=L.name;$('#planLead').textContent=L.lead;$('#planChip').textContent=P.name+' × '+Md.name;
  const rows=[['小間数',L.koma+'小間'],['間口 × 奥行',mm(s.W)+' × '+mm(s.D)],['床面積',(s.W*s.D).toFixed(1)+' m²'],['開放面',L.open],['最高高さ（看板天端）',mm(s.maxH)],['曲面壁の高さ',mm(s.wallH)],['リング看板の直径',mm(s.signD)],
    ['映像',s.screens.join('、')],['ミニゲーム試遊台',s.games+'台'],['ショーケース（H2,300）',s.cases+'台'],['展示テーブル（φ840）',s.tables+'台'],['打合せ席',s.seats+'席']];
  $('#spec').innerHTML=rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('');
  $('#modeSub').textContent=state.white?'形と寸法だけを白い模型で表示しています。':(P.name+'の出力シート ／ '+P.name+'系パンチカーペット ／ 照明：'+Md.lightName);}

function viewPose(v){const Lr=LAYOUTS[state.layout],W=Lr.W,D=Lr.D,R=Math.max(W,D);const k=camera.aspect<1?1.6:1;
  const P={persp:[[R*1.08*k,R*.5+2.1,D/2+R*1.08*k],[0,1.55,0]],front:[[0,1.65,D/2+R*1.15*k+.8],[0,1.4,0]],top:[[0,R*1.5*k+4,.01],[0,0,0]],
    eye:[[W*.18,1.6,D/2+2.6],[-W*.05,1.35,-D*.15]],back:[[-R*.8*k,R*.42+2,-D/2-R*.95*k],[0,1.2,0]],sign:[[R*.35,1.5,D/2+2.2],[0,3.2,0]]}[v];
  return {p:new T.Vector3(...P[0]),t:new T.Vector3(...P[1])};}
function goView(v,anim){userMoved=false;const to=viewPose(v);
  if(!anim||matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.copy(to.p);controls.target.copy(to.t);controls.update();return;}
  camTween={fromP:camera.position.clone(),fromT:controls.target.clone(),to,t0:performance.now(),dur:900};}
function resize(){const r=view.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();if(root&&!userMoved&&!camTween)goView(state.view,false);}
new ResizeObserver(resize).observe(view);
const v3=new T.Vector3();let lastTex=0;
function frame(now){requestAnimationFrame(frame);
  if(camTween){const k=Math.min(1,(now-camTween.t0)/camTween.dur),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;camera.position.lerpVectors(camTween.fromP,camTween.to.p,e);controls.target.lerpVectors(camTween.fromT,camTween.to.t,e);if(k>=1)camTween=null;}
  controls.update();const t=now/1000;
  if(now-lastTex>66){lastTex=now;animTex.forEach(a=>a.draw(t));}
  if(root&&groups.sign.visible)groups.sign.traverse(o=>{if(o.userData.bob){o.position.y=o.userData.bob.y+Math.sin(t*.8+o.userData.bob.ph)*.03;o.rotation.y=o.userData.bob.ry+Math.sin(t*.35+o.userData.bob.ph)*.6;}});
  renderer.render(scene,camera);
  if(state.dims&&dimList.length){const w=renderer.domElement.clientWidth,h=renderer.domElement.clientHeight;dimList.forEach(d=>{v3.copy(d.pos).project(camera);const vis=v3.z<1&&v3.z>-1;d.el.style.display=vis?'':'none';if(vis){d.el.style.left=((v3.x+1)/2*w)+'px';d.el.style.top=((1-v3.y)/2*h)+'px';}});}}
const fontsReady=Promise.race([Promise.all(['600 40px "Cormorant Garamond"','700 40px "Shippori Mincho"','700 40px "Zen Kaku Gothic New"','500 40px "Zen Kaku Gothic New"'].map(f=>document.fonts.load(f,'AIで○△□'))),new Promise(r=>setTimeout(r,2500))]).catch(()=>{});
fontsReady.then(()=>{resize();build();goView('persp',false);loadEl.remove();requestAnimationFrame(frame);});
})();
</script>
