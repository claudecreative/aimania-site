<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TOKYO CC WORKS</title>
<style>

*{box-sizing:border-box}
[hidden]{display:none!important}

.lockcard h1{margin:0;font-size:18px}.lockcard h1 span{color:#00b45a}
.lockcard p{margin:0;color:var(--color-fg-muted);font-size:13px}
.lockcard input{font:inherit;padding:10px 12px;border:1px solid var(--color-border-line);border-radius:10px;background:var(--color-bg);color:var(--color-fg)}
.lockcard button{font:inherit;border:0;border-radius:999px;padding:10px 16px;background:#00b45a;color:#fff;font-weight:700;cursor:pointer}
.lockcard .err{color:#d93d42;font-size:13px;min-height:1.2em}
</style>
</head>

</div>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(pw){
  const k0 = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'}, k0, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function makeDash(src){
  const calcs = {}, draws = {}, cache = {};
  const get = (id) => {
    if (id in src) return {status:'ok', data:src[id], columns: src[id][0] ? Object.keys(src[id][0]) : [], refreshing:false, truncated:false, meta:null};
    if (calcs[id]) { if (!(id in cache)) cache[id] = calcs[id].fn(...calcs[id].inputs.map((i) => get(i).data)); return {status:'ok', data:cache[id], refreshing:false, truncated:false, meta:null}; }
    return {status:'missing', data:[], message:'missing'};
  };
  const run = (name) => { const fn = draws[name]; if (!fn) return; document.querySelectorAll('[data-draw="' + name + '"]').forEach((el) => { try { fn(el); } catch (e) { console.error(name, e); } }); };
  return {
    data: get,
    calc: (id, spec) => { calcs[id] = spec; },
    loader: () => {},
    draw: (name, fn) => { if (fn) draws[name] = fn; run(name); },
    onData: (fn) => fn(),
    params: () => ({}), setParams: () => {}, resetParams: () => {}, setLink: () => {}, refresh: () => {},
    colors: ['#00b45a','#3d8bfd','#f59e0b','#f0506e','#8b7cf6','#14b8a6'],
    _all: () => Object.keys(draws).forEach(run)
  };
}
document.getElementById('lockform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  let p;
  try { p = await decrypt(document.getElementById('pw').value); } catch (x) { err.textContent = 'パスワードが違います'; return; }
  window.dash = makeDash(p.data);
  const root = document.getElementById('dash-root');
  const tpl = document.createElement('template'); tpl.innerHTML = p.html;
  const scripts = [...tpl.content.querySelectorAll('script')];
  scripts.forEach((s) => s.remove());
  root.replaceChildren(tpl.content);
  document.getElementById('lock').hidden = true; root.hidden = false;
  for (const s of scripts) { try { (0, eval)(s.textContent); } catch (x) { console.error(x); } }
  window.dash._all();
  let w = root.clientWidth; window.addEventListener('resize', () => { if (root.clientWidth !== w) { w = root.clientWidth; window.dash._all(); } });
});
